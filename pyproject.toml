[project]
name = "waveapp"
dynamic = ["version"]  # single source: waveapp/__init__.py (Phase 9)
description = "Wave — autonomous US-equity daytrading bot with a PyQt6 desktop dashboard (macOS, Apple Silicon)"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Runtime dependencies are added phase by phase (per SPEC.md §16).
dependencies = [
    # Phase 1 — app shell & security
    "PyQt6>=6.7",
    "qasync>=0.27",
    "keyring>=25.0",
    "argon2-cffi>=23.1",
    "pyobjc-framework-LocalAuthentication>=10.0; sys_platform == 'darwin'",
    # Phase 2 — broker abstraction & paper connection
    "alpaca-py>=0.30",
    "ib_async>=1.0",
    # Phase 6 — exchange calendar (NYSE holidays/half-days, all years)
    "exchange-calendars>=4.5",
    # Phase 4 — Telegram bridge
    "python-telegram-bot>=21.0",
    # Phase 8 — Apple glass materials (secured early, 2026-08-14)
    "pyqt-liquidglass>=0.1; sys_platform == 'darwin'",
    # Phase 8.6 — Performance tab equity curve (SPEC.md §2 charts)
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
# Phase 10 research layer (§2: vectorbt for fast sweeps; never in the engine)
research = [
    "vectorbt>=1.0",
    "pandas>=2.0",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pyinstaller>=6.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["waveapp*"]

[tool.setuptools.dynamic]
version = { attr = "waveapp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]  # assert is the point of tests; test passwords are fake
# lab code: research scripts and the GRIDY simulator are working notebooks,
# not app code — long lines and compact one-liners are fine there
"research/**" = ["E402", "E501", "E701", "E702", "E731", "E741", "S", "B"]
"gridy/**" = ["E501", "E702", "S"]
"scripts/research_*" = ["E501", "E702", "S"]
